<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎4</title>

    <style>
        /* レイアウトを少し見やすく整える */
        body {
            font-family: sans-serif;
            max-width: 500px; /* 画面が横に広がりすぎないように制限 */
            margin: 0 auto;
            padding: 20px;
        }

        img {
            max-width: 100%; /* 画像が画面からはみ出さないようにする */
            height: auto;
            margin-bottom: 20px;
        }

        /* スマホで文字が小さすぎて拡大されるのを防ぐ */
        input[type="text"] {
            font-size: 16px;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px; /* ボタンとの隙間をあける */
        }

        /* ボタンを押しやすくする */
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #007bff; /* パッと見でボタンとわかる青 */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%; /* スマホの横幅いっぱいに広げて押しやすく */
        }

        /* 結果メッセージのスタイル */
        .result-message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <p>テストテキスト（ここに問題文が入ります）</p>
    <img src="../images/yasuaki.jpg" alt="ここに画像を表示">

    <input type="text" id="answer-input" placeholder="答えを入力してください" />
    <button id="submit-button">回答する</button>

    <div id="message" class="result-message"></div>

    <script>
        // HTMLの要素をJavaScriptに読み込みます
        const button = document.getElementById("submit-button");
        const input = document.getElementById("answer-input");
        const message = document.getElementById("message");

        // ボタンがクリックされたときの処理
        button.addEventListener("click", function () {
            // 入力された文字を取得し、前後のスペースを消して小文字にする
            let userAnswer = input.value.trim().toLowerCase();

            // 正誤判定
            if (userAnswer === "apple") {
                // 正解の処理
                message.textContent = "⭕ 正解！次の問題へ進んでください。";
                message.style.color = "#28a745"; // 緑色
            } else {
                // 不正解の処理
                message.textContent = "❌ 違います。もう一度考えてみよう！";
                message.style.color = "#dc3545"; // 赤色
            }
        });
    </script>

</body>
</html>
