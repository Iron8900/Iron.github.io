<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝・クリア！</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* クリア画面専用の特別なデザイン */
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .clear-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* お祝いの演出アニメーション（ふわっと大きく表示） */
        .congrats-title {
            font-size: 32px;
            color: #ffc107; /* ゴールド */
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            animation: popIn 0.8s ease-out;
        }

        .congrats-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
        }

        /* 💡 画像をでかでかと魅力的に見せる枠 */
        .image-wrapper {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); /* 高級感のある影 */
            margin-bottom: 40px;
            animation: fadeIn 1.2s ease-out;
        }

        .clear-image {
            width: 100%; /* 枠の横幅いっぱいに広げる */
            height: auto; /* 縦横比を崩さない */
            border-radius: 6px;
            display: block;
        }

        /* トップに戻るボタン */
        .back-button {
            display: inline-block;
            background-color: #6c757d; /* 落ち着いたグレー */
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

            .back-button:active {
                background-color: #5a6268;
            }

        /* アニメーションの動きの設定 */
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="clear-container">
        <div class="congrats-title">🎉 GAME CLEAR !! 🎉</div>
        <p class="congrats-text">見事にすべての謎を解き明かした！</p>

        <div class="image-wrapper">
            <img src="images/perytagaya.jpg" alt="クリア報酬の画像" class="clear-image">
        </div>

        <a href="index.html" class="back-button">トップページに戻る</a>
    </div>

</body>
</html>
